          conexión cultural.
        en: Brand identity and strategic direction for businesses with personality and
          cultural relevance.
    - title: { es: Gestión de redes sociales, en: Social media management }
      description:
        es: Contenido y gestión de redes para fortalecer la comunidad y la presencia
          digital.
