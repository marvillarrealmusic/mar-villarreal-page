biography:
  eyebrow: { es: Mi historia, en: My story }
  title: { es: Música con raíces y movimiento, en: Music with roots and movement }
  body:
    es: |
      Nací en Puntarenas, en la costa pacífica de Costa Rica, y desde pequeña la música forma parte de mi vida. Canto, compongo y produzco canciones inspiradas por el soul, el R&B, el reggae y el pop.

      Cada canción es una oportunidad para experimentar y descubrir algo nuevo. Después de mi debut con «Made in Costa Rica», he seguido explorando sonidos y encontrando nuevas formas de contar historias.

      Además de la música, trabajo como consultora creativa en proyectos de marca, redes sociales y marketing digital.
    en: |
      I was born in Puntarenas, on Costa Rica’s Pacific coast, and music has been part of my life since childhood. I sing, write and produce songs inspired by soul, R&B, reggae and pop.

      Every song is an opportunity to experiment and discover something new. Since my debut with “Made in Costa Rica”, I have continued exploring sounds and finding new ways to tell stories.

      Alongside music, I work as a creative consultant on branding, social media and digital marketing projects.
  image:
    src: /images/biography.jpg
    alt:
      es: Mar Villarreal, cantante y compositora
      en: Mar Villarreal, singer and songwriter
    position: center

