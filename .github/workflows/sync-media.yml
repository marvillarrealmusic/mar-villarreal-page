name: Sync Spotify and YouTube

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: [content/site.yml]

permissions:
  contents: write

concurrency:
  group: sync-media-master
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Import public metadata and images
        run: npm run sync:content
      - run: npm run validate:content
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true
      - name: Save verified content on master
        shell: bash
        run: |
          git add content/site.yml public/images/releases
          if [ -d public/images/videos ]; then git add public/images/videos; fi
          if git diff --cached --quiet; then
            echo "No changes to save." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git fetch origin master
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "::error::master changed during import. Run the workflow again; no changes were pushed."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Spotify releases and YouTube videos"
          if ! git push origin HEAD:master; then
            echo "::error::Could not update master. Check branch protection and Actions write permissions. No force push was attempted."
            exit 1
          fi
